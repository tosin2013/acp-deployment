---

_namespace:
  apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      openshift.io/cluster-monitoring: "true"
    name: openshift-storage

_operator_group:
  apiVersion: operators.coreos.com/v1
  kind: OperatorGroup
  metadata:
    name: openshift-storage-operatorgroup
    namespace: openshift-storage
  spec:
    targetNamespaces:
      - openshift-storage

_subscription:
  apiVersion: operators.coreos.com/v1alpha1
  kind: Subscription
  metadata:
    name: odf-operator
    namespace: openshift-storage
  spec:
    channel: "stable-4.21"
    installPlanApproval: Automatic
    name: odf-operator
    source: redhat-operators
    sourceNamespace: openshift-marketplace

_network_attachment_definitions_config:
  cniVersion: '0.3.1'
  type: macvlan
  master: "{{ openshift.all_node_settings.storage_interface }}"
  mode: bridge
  ipam:
    type: whereabouts
    range: "{{ openshift.storage_network | default('192.168.2.0/24') }}"

_network_attachment_definitions:
  apiVersion: k8s.cni.cncf.io/v1
  kind: NetworkAttachmentDefinition
  metadata:
    name: ocs-public-cluster
    namespace: openshift-storage
  spec:
    config: "{{ _network_attachment_definitions_config | to_json }}"

_storage_system:
  apiVersion: odf.openshift.io/v1alpha1
  kind: StorageSystem
  metadata:
    name: ocs-storagecluster-storagesystem
    namespace: openshift-storage
  spec:
    name: ocs-storagecluster
    namespace: openshift-storage
    kind: storagecluster.ocs.openshift.io/v1


# Multus network block — merged into StorageCluster spec only when odf_use_multus: true.
# Defined separately so combine() can conditionally add it without the omit workaround.
_storage_cluster_multus_network:
  provider: multus
  selectors:
    cluster: openshift-storage/ocs-public-cluster
    public: openshift-storage/ocs-public-cluster

_storage_cluster_base:
  apiVersion: ocs.openshift.io/v1
  kind: StorageCluster
  metadata:
    annotations:
      cluster.ocs.openshift.io/local-devices: 'true'
      uninstall.ocs.openshift.io/cleanup-policy: delete
      uninstall.ocs.openshift.io/mode: graceful
    name: ocs-storagecluster
    namespace: openshift-storage
  spec:
    storageDeviceSets:
      - config: {}
        # odf_device_count: total ODF disks across all nodes (disks_per_node × node_count).
        # KVM default: 2 disks × 3 nodes = 6. Bare-metal with NVMe: set odf_device_count accordingly.
        # | int ensures Ansible passes an integer, not a string, to the OCS API.
        count: "{{ openshift.all_node_settings.odf_device_count | default(6) | int }}"
        dataPVCTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: '1'
            storageClassName: local-disks
            volumeMode: Block
        name: ocs-deviceset-local-disks
        replica: 1
    monDataDirHostPath: /var/lib/rook
    externalStorage: {}
    flexibleScaling: true
    failureDomain: host
    failureDomainKey: kubernetes.io/hostname

# _storage_cluster is built in tasks/main.yml via set_fact using combine() so the
# network block is only present when odf_use_multus: true (bare-metal bond0).
_storage_cluster: "{{ _storage_cluster_base }}"
